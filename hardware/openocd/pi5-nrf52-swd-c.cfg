adapter driver linuxgpiod
adapter gpio swdio 13 -chip 4
adapter gpio swclk 19 -chip 4
# Optional: nRESET on GPIO 26 — enable only if needed (blocks halt when forced, same as board B)
# adapter gpio srst 26 -chip 4
# reset_config srst_only srst_push_pull
transport select swd
adapter speed 500
telnet_port 4446
gdb_port 3335
tcl_port 6668
echo "Pi 5 SWD board C ready (SWDIO=13 SWCLK=19 gpiochip4)"