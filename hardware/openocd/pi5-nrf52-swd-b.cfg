adapter driver linuxgpiod
adapter gpio swdio 16 -chip 4
adapter gpio swclk 20 -chip 4
# Optional: nRESET on GPIO 21 — enable only if wired
# adapter gpio srst 21 -chip 4
# reset_config srst_only srst_push_pull
transport select swd
adapter speed 500
telnet_port 4445
gdb_port 3334
tcl_port 6667
echo "Pi 5 SWD board B ready (SWDIO=16 SWCLK=20 gpiochip4)"