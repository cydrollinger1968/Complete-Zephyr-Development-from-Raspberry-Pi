adapter driver linuxgpiod
adapter gpio swdio 22 -chip 4
adapter gpio swclk 27 -chip 4
# Optional: nRESET on GPIO 17
# adapter gpio srst 17 -chip 4
# reset_config srst_only srst_push_pull
transport select swd
adapter speed 500
telnet_port 4447
gdb_port 3336
tcl_port 6669
echo "Pi 5 SWD board D ready (SWDIO=22 SWCLK=27 RST=17 gpiochip4)"